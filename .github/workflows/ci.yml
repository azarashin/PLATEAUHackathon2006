name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: データ・日陰・経路・Viewer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install Viewer dependencies
        run: npm --prefix viewer ci

      - name: Verify fixtures, contracts, routing, and Viewer
        run: node tools/ci/verify.mjs
